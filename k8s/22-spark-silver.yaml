# Silver streaming job: bronze.trip_updates -> silver.stop_delays (stateful, 15-min watermark).
# replicas: 1 + Recreate, never scaled: single-writer checkpoint with RocksDB state.
apiVersion: v1
kind: Service
metadata:
  name: spark-silver
  namespace: transit-lakehouse
  labels: {app.kubernetes.io/name: spark-silver}
spec:
  selector: {app.kubernetes.io/name: spark-silver}
  ports:
    - {name: ui, port: 4040, targetPort: 4040}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-silver
  namespace: transit-lakehouse
  labels: {app.kubernetes.io/name: spark-silver, app.kubernetes.io/part-of: transit-lakehouse}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: spark-silver}
  template:
    metadata:
      labels: {app.kubernetes.io/name: spark-silver, app.kubernetes.io/part-of: transit-lakehouse}
    spec:
      initContainers:
        - name: wait-for-deps
          image: transit-lakehouse/spark:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import socket, time
              for host, port in [("minio", 9000), ("iceberg-catalog-db", 5432), ("spark", 4040)]:
                  while True:   # spark:4040 = bronze is up (it creates bronze.trip_updates)
                      try:
                          socket.create_connection((host, port), 3).close(); print("ok", host); break
                      except OSError:
                          print("waiting for", host); time.sleep(3)
      containers:
        - name: silver
          image: transit-lakehouse/spark:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "silver_job.py"]
          envFrom:
            - configMapRef: {name: pipeline-config}
          env:
            - {name: SPARK_DRIVER_MEMORY, value: "2g"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: lakehouse-creds, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: lakehouse-creds, key: AWS_SECRET_ACCESS_KEY}}
            - name: CATALOG_DB_USER
              valueFrom: {secretKeyRef: {name: lakehouse-creds, key: CATALOG_DB_USER}}
            - name: CATALOG_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: lakehouse-creds, key: CATALOG_DB_PASSWORD}}
          ports:
            - {name: ui, containerPort: 4040}
          readinessProbe:
            httpGet: {path: /api/v1/applications, port: 4040}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/v1/applications, port: 4040}
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            # measured ~4.3Gi in compose: 2g heap + RocksDB (off-heap) + pandas Python workers
            requests: {cpu: "1", memory: 2560Mi}
            limits: {memory: 5Gi}      # peaked at 4.17Gi on kind; 4.5Gi was too tight
