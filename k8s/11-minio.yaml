# S3-compatible object store for the Iceberg warehouse, checkpoints and the static schedule.
# Same image as compose (MinIO stopped publishing images; this is the frozen 2024-10-13 release).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: transit-lakehouse
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: transit-lakehouse
  labels: {app.kubernetes.io/name: minio}
spec:
  selector: {app.kubernetes.io/name: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: transit-lakehouse
  labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: transit-lakehouse}
spec:
  replicas: 1
  strategy: {type: Recreate}   # RWO volume: never two pods on it
  selector:
    matchLabels: {app.kubernetes.io/name: minio}
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: transit-lakehouse}
    spec:
      securityContext: {fsGroup: 1001}
      containers:
        - name: minio
          image: bitnamilegacy/minio:2024.10.13
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: lakehouse-creds, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: lakehouse-creds, key: MINIO_ROOT_PASSWORD}}
            - {name: MINIO_CONSOLE_PORT_NUMBER, value: "9001"}
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /bitnami/minio/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: minio-data}
