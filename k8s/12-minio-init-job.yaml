# One-shot: create the lakehouse bucket (idempotent). Retries until MinIO answers.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: transit-lakehouse
  labels: {app.kubernetes.io/name: minio-init, app.kubernetes.io/part-of: transit-lakehouse}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio-init}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: bitnamilegacy/minio-client:2024.10.8
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && break
                echo waiting for minio...; sleep 2
              done
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing "local/$LAKEHOUSE_BUCKET" &&
              echo "bucket ready: $LAKEHOUSE_BUCKET"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: lakehouse-creds, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: lakehouse-creds, key: MINIO_ROOT_PASSWORD}}
            - name: LAKEHOUSE_BUCKET
              valueFrom: {configMapKeyRef: {name: pipeline-config, key: LAKEHOUSE_BUCKET}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
