# OPTIONAL addon (~100Mi). Same provisioning + dashboard as compose, from ConfigMaps built from
# observability/grafana/ (see k8s/README.md). http://localhost:13000 via the kind port mapping.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: transit-lakehouse
  labels: {app.kubernetes.io/name: grafana}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: web, port: 3000, targetPort: 3000, nodePort: 30300}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: transit-lakehouse
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: transit-lakehouse}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: transit-lakehouse}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          imagePullPolicy: IfNotPresent
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/pipeline.json}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
          ports:
            - {name: web, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
