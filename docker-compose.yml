# Transit lakehouse — local stack.
# Rule: each phase APPENDS service blocks at the marked insertion point.
# Never edit a block from an earlier phase.
#
# Host port map (reserved up front so later phases don't collide):
#   19092 Kafka (host)   8080 Redpanda console   9000/9001 MinIO API/console
#   8000  poller metrics 4040-4042 Spark UIs     8081 Airflow   9090 Prometheus   3000 Grafana
#   10000 Spark Thrift (JDBC)   8085 dbt docs

name: transit-lakehouse

services:
  # ---------------------------------------------------------------- phase 0
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
      # Two listeners: containers use redpanda:9092, the host uses localhost:19092
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # MinIO no longer publishes images to Docker Hub/quay; this is the same
  # 2024-10-13 MinIO release, frozen in Bitnami's legacy repository.
  minio:
    image: bitnamilegacy/minio:2024.10.13
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: creates the lakehouse bucket (idempotent), then exits 0.
  minio-init:
    image: bitnamilegacy/minio-client:2024.10.8
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 && break;
        echo waiting for minio...; sleep 2;
      done &&
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$LAKEHOUSE_BUCKET &&
      echo bucket ready: $$LAKEHOUSE_BUCKET
      "
    restart: "no"

  # ---------------------------------------------------------------- phase 1+
  # >>> INSERTION POINT: append new service blocks below this line <<<

  # ---------------------------------------------------------------- phase 1
  poller:
    build: ./ingestion
    image: transit-lakehouse/poller:latest
    container_name: poller
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      GTFS_RT_VEHICLE_POSITIONS_URL: ${GTFS_RT_VEHICLE_POSITIONS_URL:-https://cdn.mbta.com/realtime/VehiclePositions.pb}
      GTFS_RT_TRIP_UPDATES_URL: ${GTFS_RT_TRIP_UPDATES_URL:-https://cdn.mbta.com/realtime/TripUpdates.pb}
      GTFS_STATIC_URL: ${GTFS_STATIC_URL:-https://cdn.mbta.com/MBTA_GTFS.zip}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
      KAFKA_RAW_PARTITIONS: ${KAFKA_RAW_PARTITIONS:-6}
      SCHEDULE_REFRESH_HOURS: ${SCHEDULE_REFRESH_HOURS:-24}
      SCHEDULE_CACHE_DIR: /data/schedule
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      METRICS_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - schedule-cache:/data/schedule
    depends_on:
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------- phase 2
  # Iceberg JDBC catalog: table -> current metadata pointer, with atomic commits.
  iceberg-catalog-db:
    image: postgres:16.4-alpine
    container_name: iceberg-catalog-db
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: ${CATALOG_DB_USER:-iceberg}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
    volumes:
      - iceberg-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d iceberg"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bronze streaming job (Spark local mode). Spark UI: http://localhost:4040
  spark:
    build: ./streaming
    image: transit-lakehouse/spark:latest
    container_name: spark
    command: ["python", "bronze_job.py"]
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CATALOG_JDBC_URL: jdbc:postgresql://iceberg-catalog-db:5432/iceberg
      CATALOG_DB_USER: ${CATALOG_DB_USER:-iceberg}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
      BRONZE_TRIGGER_SECONDS: ${BRONZE_TRIGGER_SECONDS:-10}
      BRONZE_WRITE_PARTITIONS: ${BRONZE_WRITE_PARTITIONS:-1}          # phase 6 tuning knob
      BRONZE_MAX_OFFSETS_PER_TRIGGER: ${BRONZE_MAX_OFFSETS_PER_TRIGGER:-}  # phase 6 tuning knob
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    ports:
      - "4040:4040"
    depends_on:
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      iceberg-catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; q=json.load(urllib.request.urlopen('http://localhost:4040/api/v1/applications', timeout=3)); sys.exit(0 if q else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------- phase 3
  # Silver streaming job: bronze.trip_updates -> silver.stop_delays. Spark UI: http://localhost:4041
  spark-silver:
    image: transit-lakehouse/spark:latest
    container_name: spark-silver
    command: ["python", "silver_job.py"]
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CATALOG_JDBC_URL: jdbc:postgresql://iceberg-catalog-db:5432/iceberg
      CATALOG_DB_USER: ${CATALOG_DB_USER:-iceberg}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
      SILVER_TRIGGER_SECONDS: ${SILVER_TRIGGER_SECONDS:-30}
      SILVER_WATERMARK: ${SILVER_WATERMARK:-15 minutes}
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-America/New_York}
      SPARK_DRIVER_MEMORY: ${SPARK_SILVER_DRIVER_MEMORY:-2g}
    ports:
      - "4041:4040"
    depends_on:
      spark:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; q=json.load(urllib.request.urlopen('http://localhost:4040/api/v1/applications', timeout=3)); sys.exit(0 if q else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------- phase 4
  # JDBC/Thrift SQL endpoint over the lakehouse catalog (dbt, BI). jdbc:hive2://localhost:10000
  spark-thrift:
    image: transit-lakehouse/spark:latest
    container_name: spark-thrift
    command: ["python", "thrift_server.py"]
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CATALOG_JDBC_URL: jdbc:postgresql://iceberg-catalog-db:5432/iceberg
      CATALOG_DB_USER: ${CATALOG_DB_USER:-iceberg}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
      SPARK_DRIVER_MEMORY: ${SPARK_THRIFT_DRIVER_MEMORY:-2g}
    ports:
      - "10000:10000"
      - "4042:4040"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      iceberg-catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 10000), 3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # dbt + Great Expectations runner (one-shot): docker compose run --rm dbt dbt build
  dbt:
    build:
      context: .
      dockerfile: dbt/Dockerfile
    image: transit-lakehouse/dbt:latest
    container_name: dbt
    profiles: ["tools"]   # not started by `docker compose up`; used via `docker compose run`
    environment:
      SPARK_THRIFT_HOST: spark-thrift
      SPARK_THRIFT_PORT: "10000"
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      DBT_PROFILES_DIR: /work/dbt
    working_dir: /work/dbt
    volumes:
      - ./dbt:/work/dbt
      - ./quality:/work/quality
    depends_on:
      spark-thrift:
        condition: service_healthy

  # ---------------------------------------------------------------- phase 5
  # Airflow in ONE container (scheduler + webserver + triggerer, LocalExecutor), metadata DB in the
  # existing Postgres. UI: http://localhost:8081 (admin / admin)
  airflow:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    image: transit-lakehouse/airflow:latest
    container_name: airflow
    environment:
      CONNECTION_CHECK_MAX_COUNT: "0"   # image's DB pre-check would fail before start_airflow.sh creates the DB
      AIRFLOW_DB_USER: ${CATALOG_DB_USER:-iceberg}
      AIRFLOW_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${CATALOG_DB_USER:-iceberg}:${CATALOG_DB_PASSWORD:-iceberg}@iceberg-catalog-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__WEBSERVER__WORKERS: "2"
      # On a loaded laptop the webserver can take > 120 s (the default) to boot; standalone mode
      # then shuts it down for good while the scheduler keeps running (seen in phase 6).
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "600"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__METRICS__STATSD_ON: "True"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      SPARK_THRIFT_HOST: spark-thrift
      SPARK_THRIFT_PORT: "10000"
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      DBT_PROFILES_DIR: /work/dbt
      # scheduled runs keep dbt/GE output in container-owned paths, not the shared bind mounts
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      QUALITY_RESULTS_DIR: /opt/airflow/quality-results
    ports:
      - "8081:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./orchestration/scripts:/opt/airflow/scripts
      - ./dbt:/work/dbt
      - ./quality:/work/quality
      - airflow-logs:/opt/airflow/logs
      - quality-results:/opt/airflow/quality-results
    depends_on:
      iceberg-catalog-db:
        condition: service_healthy
      spark-thrift:
        condition: service_healthy
      statsd-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health | grep -q '\"scheduler\": {\"latest_scheduler_heartbeat\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  statsd-exporter:   # Airflow StatsD -> Prometheus
    image: prom/statsd-exporter:v0.27.2
    container_name: statsd-exporter
    command: ["--statsd.mapping-config=/etc/statsd/mapping.yml"]
    volumes:
      - ./observability/statsd_mapping.yml:/etc/statsd/mapping.yml:ro
    restart: unless-stopped

  # Consumer lag, DLQ depth, end-to-end latency, freshness, quality gate (read-only)
  pipeline-exporter:
    build: ./observability/exporter
    image: transit-lakehouse/pipeline-exporter:latest
    container_name: pipeline-exporter
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SPARK_THRIFT_HOST: spark-thrift
      QUALITY_RESULT_PATH: /quality/results/latest.json
    volumes:
      - quality-results:/quality/results:ro   # written by the Airflow ge_checkpoint task
    depends_on:
      redpanda:
        condition: service_healthy
      spark-thrift:
        condition: service_healthy
    restart: unless-stopped

  prometheus:   # http://localhost:9090  (alerts: /alerts)
    image: prom/prometheus:v2.53.2
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:   # http://localhost:3000  (anonymous view; admin / admin to edit)
    image: grafana/grafana:11.2.2
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redpanda-data:
  minio-data:
  # >>> INSERTION POINT: append new volumes below this line <<<
  schedule-cache:   # phase 1
  iceberg-catalog-data:   # phase 2
  airflow-logs:           # phase 5
  prometheus-data:        # phase 5
  grafana-data:           # phase 5
  quality-results:        # phase 5
