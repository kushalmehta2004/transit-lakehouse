# Transit lakehouse — local stack.
# Rule: each phase APPENDS service blocks at the marked insertion point.
# Never edit a block from an earlier phase.
#
# Host port map (reserved up front so later phases don't collide):
#   19092 Kafka (host)   8080 Redpanda console   9000/9001 MinIO API/console
#   8000  poller metrics 4040 Spark UI           8081 Airflow   9090 Prometheus   3000 Grafana

name: transit-lakehouse

services:
  # ---------------------------------------------------------------- phase 0
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
      # Two listeners: containers use redpanda:9092, the host uses localhost:19092
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # MinIO no longer publishes images to Docker Hub/quay; this is the same
  # 2024-10-13 MinIO release, frozen in Bitnami's legacy repository.
  minio:
    image: bitnamilegacy/minio:2024.10.13
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: creates the lakehouse bucket (idempotent), then exits 0.
  minio-init:
    image: bitnamilegacy/minio-client:2024.10.8
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 && break;
        echo waiting for minio...; sleep 2;
      done &&
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$LAKEHOUSE_BUCKET &&
      echo bucket ready: $$LAKEHOUSE_BUCKET
      "
    restart: "no"

  # ---------------------------------------------------------------- phase 1+
  # >>> INSERTION POINT: append new service blocks below this line <<<

  # ---------------------------------------------------------------- phase 1
  poller:
    build: ./ingestion
    image: transit-lakehouse/poller:latest
    container_name: poller
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      GTFS_RT_VEHICLE_POSITIONS_URL: ${GTFS_RT_VEHICLE_POSITIONS_URL:-https://cdn.mbta.com/realtime/VehiclePositions.pb}
      GTFS_RT_TRIP_UPDATES_URL: ${GTFS_RT_TRIP_UPDATES_URL:-https://cdn.mbta.com/realtime/TripUpdates.pb}
      GTFS_STATIC_URL: ${GTFS_STATIC_URL:-https://cdn.mbta.com/MBTA_GTFS.zip}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
      KAFKA_RAW_PARTITIONS: ${KAFKA_RAW_PARTITIONS:-6}
      SCHEDULE_REFRESH_HOURS: ${SCHEDULE_REFRESH_HOURS:-24}
      SCHEDULE_CACHE_DIR: /data/schedule
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      METRICS_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - schedule-cache:/data/schedule
    depends_on:
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------- phase 2
  # Iceberg JDBC catalog: table -> current metadata pointer, with atomic commits.
  iceberg-catalog-db:
    image: postgres:16.4-alpine
    container_name: iceberg-catalog-db
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: ${CATALOG_DB_USER:-iceberg}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
    volumes:
      - iceberg-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d iceberg"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bronze streaming job (Spark local mode). Spark UI: http://localhost:4040
  spark:
    build: ./streaming
    image: transit-lakehouse/spark:latest
    container_name: spark
    command: ["python", "bronze_job.py"]
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CATALOG_JDBC_URL: jdbc:postgresql://iceberg-catalog-db:5432/iceberg
      CATALOG_DB_USER: ${CATALOG_DB_USER:-iceberg}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
      BRONZE_TRIGGER_SECONDS: ${BRONZE_TRIGGER_SECONDS:-10}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    ports:
      - "4040:4040"
    depends_on:
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      iceberg-catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; q=json.load(urllib.request.urlopen('http://localhost:4040/api/v1/applications', timeout=3)); sys.exit(0 if q else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  redpanda-data:
  minio-data:
  # >>> INSERTION POINT: append new volumes below this line <<<
  schedule-cache:   # phase 1
  iceberg-catalog-data:   # phase 2
