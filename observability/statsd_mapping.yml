# Airflow StatsD names -> labeled Prometheus metrics (statsd-exporter)
mappings:
  - match: "airflow.dagrun.duration.success.*"
    name: airflow_dagrun_duration_seconds
    labels: {dag_id: "$1", state: success}
  - match: "airflow.dagrun.duration.failed.*"
    name: airflow_dagrun_duration_seconds
    labels: {dag_id: "$1", state: failed}
  - match: "airflow.ti.finish.*.*.*"
    name: airflow_task_finish_total
    labels: {dag_id: "$1", task_id: "$2", state: "$3"}
  - match: "airflow.dag.*.*.duration"
    name: airflow_task_duration_seconds
    labels: {dag_id: "$1", task_id: "$2"}
  - match: "airflow.scheduler_heartbeat"
    name: airflow_scheduler_heartbeat_total
  - match: "airflow.dag_processing.import_errors"
    name: airflow_dag_import_errors
  # everything else Airflow emits (a glob "*" only matches one dot-segment, so use a regex)
  - match: "airflow\\..*"
    match_type: regex
    action: drop
    name: dropped
