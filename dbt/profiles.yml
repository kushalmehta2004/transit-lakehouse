transit_lakehouse:
  target: dev
  outputs:
    dev:
      type: spark
      method: thrift
      host: "{{ env_var('SPARK_THRIFT_HOST', 'localhost') }}"
      port: "{{ env_var('SPARK_THRIFT_PORT', '10000') | int }}"
      user: dbt
      schema: gold
      connect_retries: 5
      connect_timeout: 60
      threads: 2
